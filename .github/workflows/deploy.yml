# Tests, migrations and deploy, as three jobs on three fresh machines so a secret
# never sits on the machine that ran the tests (plan 16.1). One deploy at a time.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  migrate:
    name: Migrate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install with the locked lockfile
        run: pnpm install --frozen-lockfile

      - name: Count new migrations
        id: pending
        env:
          DATABASE_URL_MIGRATOR: ${{ secrets.DATABASE_URL_MIGRATOR }}
        run: |
          # psql 16 on the runner needs sslrootcert=system to verify Neon's certificate.
          q() { psql "${DATABASE_URL_MIGRATOR}&sslrootcert=system" -XtAq -v ON_ERROR_STOP=1 -c "$1"; }
          total=$(jq '.entries | length' migrations/meta/_journal.json)
          applied=0
          if [ "$(q "SELECT to_regclass('drizzle.migrations') IS NOT NULL")" = "t" ]; then
            applied=$(q "SELECT count(*) FROM drizzle.migrations")
          fi
          echo "count=$((total - applied))" >> "$GITHUB_OUTPUT"
          echo "$((total - applied)) new migrations."

      - name: Wait until no measurement is running (at most 5 minutes)
        if: steps.pending.outputs.count != '0'
        env:
          DATABASE_URL_MIGRATOR: ${{ secrets.DATABASE_URL_MIGRATOR }}
        run: |
          q() { psql "${DATABASE_URL_MIGRATOR}&sslrootcert=system" -XtAq -v ON_ERROR_STOP=1 -c "$1"; }
          if [ "$(q "SELECT to_regclass('core.job_run') IS NOT NULL")" != "t" ]; then exit 0; fi
          for i in $(seq 1 30); do
            running=$(q "SELECT count(*) FROM core.job_run WHERE status = 'running' AND lease_until > now()")
            [ "$running" = "0" ] && exit 0
            sleep 10
          done
          echo "A measurement is still running after 5 minutes."
          exit 1

      - name: Restore point in Neon (the three newest are kept)
        if: steps.pending.outputs.count != '0'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches"
          auth="Authorization: Bearer ${NEON_API_KEY}"
          # Neon answers 423 while another operation on the project runs, so every call retries.
          neon() { curl -fsS --retry 6 --retry-all-errors --retry-delay 5 -H "$auth" "$@"; }
          # Old points go first, keeping the two newest, so there are three after the new one.
          old=$(neon "$api" | jq -r '.branches | map(select(.name | startswith("restore-"))) | sort_by(.created_at) | reverse | .[2:][] | .id')
          for id in $old; do neon -X DELETE "$api/$id" > /dev/null; echo "Removed an old restore point."; done
          name="restore-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          neon -X POST -H "Content-Type: application/json" -d "{\"branch\":{\"name\":\"${name}\"}}" "$api" > /dev/null
          echo "Created ${name}."

      - name: Run the migrations as oc_migrator
        env:
          DATABASE_URL_MIGRATOR: ${{ secrets.DATABASE_URL_MIGRATOR }}
        run: pnpm run db:migrate

  deploy:
    name: Deploy to Vercel
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install with the locked lockfile
        run: pnpm install --frozen-lockfile

      - name: Deploy and check that the domain serves the new deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # The commit id goes in as CODE_VERSION, since Vercel doesn't set it for CLI deploys.
          url=$(pnpm exec vercel deploy --prod --yes --token "$VERCEL_TOKEN" --env CODE_VERSION="${GITHUB_SHA}")
          # vercel deploy waits until the deployment is ready and aliased; the API
          # check below confirms READY and that the domain serves it.
          echo "Deployed ${url}."
          api="https://api.vercel.com/v13/deployments"
          new_id=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$api/${url#https://}?teamId=${VERCEL_ORG_ID}" | jq -r '.id + " " + .readyState')
          host="${APP_URL#https://}"
          host="${host%/}"
          live_id=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$api/${host}?teamId=${VERCEL_ORG_ID}" | jq -r '.id')
          echo "New: ${new_id}. Live on ${APP_URL}: ${live_id}."
          if [ "${new_id%% *}" != "$live_id" ] || [ "${new_id##* }" != "READY" ]; then
            echo "The domain does not serve the new deployment. After an Instant Rollback, choose Undo Rollback in Vercel first."
            exit 1
          fi
