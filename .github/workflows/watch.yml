# The second guard (plan 7): every third hour 05-23 UTC it reads the run log with
# the backup's read-only role. If the data is as old as the banner would say, or
# the guard hasn't run for a day, the run fails and GitHub e-mails about it. This
# channel goes through neither Vercel nor Resend.
name: Watch

on:
  schedule:
    - cron: "0 5-23/3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: watch
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  watch:
    name: Measurements and guard are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install with the locked lockfile
        run: pnpm install --frozen-lockfile

      - name: Read the run log
        env:
          DATABASE_URL_BACKUP: ${{ secrets.DATABASE_URL_BACKUP }}
        run: pnpm exec tsx scripts/watch.ts
