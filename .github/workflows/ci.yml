# The checks on every pull request and push (plan 15.5). Runs without secrets.
# deploy.yml calls the same workflow before anything is migrated or deployed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install with the locked lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Prettier
        run: pnpm run format:check

      - name: Type check
        run: pnpm run typecheck

      - name: Em dash, design and migration checks
        run: pnpm run check

      - name: Schema and migrations match
        run: |
          pnpm exec drizzle-kit generate --name drift-check
          if [ -n "$(git status --porcelain migrations)" ]; then
            git status --porcelain migrations
            echo "The schema in src/lib/db/schema has changes without a migration. Run pnpm db:generate."
            exit 1
          fi

      - name: Unit tests in UTC
        run: pnpm run test
        env:
          TZ: UTC

      - name: Unit tests in New York
        run: pnpm run test
        env:
          TZ: America/New_York

      - name: Integration tests against Postgres
        run: pnpm run test:integration

      - name: Build
        run: pnpm run build

      - name: Browser for the end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests against the built app
        run: pnpm run test:e2e

      - name: Keep the end-to-end report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Secrets scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
