# Backups (plan 16.2): every night at 02:30 UTC the small tables whole and the
# rows added to the growing tables, every Sunday at 03:30 UTC all of core and
# availability. Each is checked by reading it into an empty copy of the database
# in this job, encrypted with age to the public key in the repo before anything
# reaches the disk, and kept for 14 days. Only one backup runs at a time.
name: Backup

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 3 * * 0"
  workflow_dispatch:
    inputs:
      kind:
        description: Which backup
        type: choice
        options: [nightly, weekly]
        default: nightly

permissions: {}

concurrency:
  group: backup
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  backup:
    name: Back up, check and encrypt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    services:
      # The empty copy to check against. It lives only in this job.
      scratch:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_PASSWORD: scratch-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install with the locked lockfile
        run: pnpm install --frozen-lockfile

      - name: Install pg_dump 18, the same major version as Neon, and age
        env:
          AGE_VERSION: 1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          curl -fsSL -o age.tar.gz "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  age.tar.gz" | sha256sum --check
          tar -xzf age.tar.gz age/age
          sudo install age/age /usr/local/bin/age
          rm -rf age age.tar.gz

      - name: Which backup and schedule point
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.kind }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "30 3 * * 0" ]; then kind=weekly; at=03:30; else kind=nightly; at=02:30; fi
            point="$(date -u +%Y-%m-%d)T${at}:00Z"
          else
            kind="$CHOSEN"
            point="$(date -u +%Y-%m-%dT%H:%M:00Z)"
          fi
          echo "KIND=$kind" >> "$GITHUB_ENV"
          echo "POINT=$point" >> "$GITHUB_ENV"
          echo "NAME=backup-${kind}-$(tr -d ':' <<< "$point")" >> "$GITHUB_ENV"

      - name: An empty copy of the database, with the roles and every migration
        env:
          SCRATCH_ADMIN_URL: postgresql://postgres:scratch-only@localhost:5432/postgres
        run: |
          url="$(pnpm exec tsx scripts/backup/scratch.ts)?sslmode=disable"
          echo "::add-mask::$url"
          echo "SCRATCH_URL=$url" >> "$GITHUB_ENV"

      - name: Back up, check against the run log, and encrypt
        env:
          DATABASE_URL_BACKUP: ${{ secrets.DATABASE_URL_BACKUP }}
          SSL_ROOT: system
          OUT: backup
          CODE_VERSION: ${{ github.sha }}
        run: scripts/backup/backup.sh

      - name: Keep the encrypted files for 14 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: backup/
          retention-days: 14
          if-no-files-found: error
